# EmpireWandPlus Configuration
# Color codes can be used with the & symbol followed by a code:
# &0 - Black          &8 - Dark Gray
# &1 - Dark Blue      &9 - Blue
# &2 - Dark Green     &a - Green
# &3 - Dark Aqua      &b - Aqua
# &4 - Dark Red       &c - Red
# &5 - Dark Purple    &d - Light Purple
# &6 - Gold          &e - Yellow
# &7 - Gray          &f - White
# 
# Format codes:
# &l - Bold          &n - Underline
# &o - Italic        &m - Strikethrough
# &k - Magic         &r - Reset

messages:
  # Prefix configuration for each wand type
  # These appear before messages related to specific wands
  prefix:
    blood: "&8[&cBlood Wand&8]&r "
    empire: "&8[&6Empire Wand&8]&r "
    elementos: "&8[&bElementos Wand&8]&r "

  # Display names for the wands when they appear in inventory
  display-names:
    blood: "&cBlood Wand"
    empire: "&6Empire Wand"
    elementos: "&bElementos Wand"

  # Error messages shown to players
  errors:
    no-permission: "&cYou're not allowed to use that!"
    inventory-full: "&cYour inventory is full!"
    invalid-wand: "&cInvalid wand type!"
    no-switch-permission: "&cYou're not allowed to switch spells!"
    no-spell-set: "&cNo spell set found for this wand!"

  # Success messages
  success:
    # {article} will be replaced with "a" or "an"
    # {wand-name} will be replaced with the wand's display name
    wand-given: "&7You have been given {article} {wand-name}"
  
  commands:
    wand:
      usage: "&cUsage: /wand [wand type]"
      invalid-wand: "&cInvalid wand type!"
      inventory-full: "&cYour inventory is full!"
      no-permission: "&cYou're not allowed to obtain this wand!"
      given: "&7You have been given {article} {wand-name}"
  
  # Add wand type configurations
  wands:
    blood:
      starts-with-vowel: false
      type-name: "blood"
    empire:
      starts-with-vowel: true
      type-name: "empire"
    elementos:
      starts-with-vowel: true
      type-name: "elementos"